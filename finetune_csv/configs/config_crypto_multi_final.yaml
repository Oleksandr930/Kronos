data:
  data_path: "/content/drive/MyDrive/KronosWork/data/crypto_multi_15m.csv"

  lookback_window: 400
  predict_window: 20
  max_context: 512
  clip: 5.0

  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

training:
  tokenizer_epochs: 0
  basemodel_epochs: 2

  batch_size: 16
  log_interval: 20
  num_workers: 2
  seed: 42

  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.0000005

  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1

  accumulation_steps: 1

model_paths:
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-small"

  exp_name: "crypto_multi_15m_final"

  base_path: "/content/drive/MyDrive/KronosWork/models"

  base_save_path: "/content/drive/MyDrive/KronosWork/models/crypto_multi_15m_final"

  finetuned_tokenizer: "/content/drive/MyDrive/KronosWork/pretrained_tokenizer_local"

  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "crypto_multi_15m_final"

  description: "Final multi-asset predictor-only experiment with untouched 10% test"

  use_comet: false

  train_tokenizer: false
  train_basemodel: true

  skip_existing: false

device:
  use_cuda: true
  device_id: 0